<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b5b">
  <meta name="description" content="汙水立坑封底澆置方數紀錄，可在手機與電腦即時共用。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>立坑封底方數紀錄</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17302b;background:#f3f7f5;font-synthesis:none;text-rendering:optimizeLegibility;--green:#176b5b;--border:#dce7e2;--muted:#60736d;--red:#a53333}
    *{box-sizing:border-box}body{margin:0}header{background:var(--green);color:white;padding:22px max(18px,calc((100% - 980px)/2))}h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 5px}header p{margin:0;color:#e3f2ed;font-size:.95rem}.wrap{max-width:980px;margin:22px auto;padding:0 16px 48px}.notice{border:1px solid #efd49a;background:#fff8e8;color:#654b16;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #18372a0a}.panel h2{font-size:1.1rem;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:650;font-size:.92rem}input,textarea,select{width:100%;font:inherit;border:1px solid #bdcec7;border-radius:9px;padding:11px 12px;background:#fff;color:inherit}input:focus,textarea:focus,select:focus{outline:3px solid #176b5b28;border-color:var(--green)}textarea{min-height:75px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8f0ed;color:#17302b}.danger{background:#fff0ef;color:var(--red)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.toolbar h2{margin:0}.toolbar input{max-width:310px}.summary{color:var(--muted);font-size:.9rem}.record{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:12px}.record h3{margin:0 0 5px;font-size:1.05rem;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.9rem;display:flex;gap:12px;flex-wrap:wrap}.note{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.record-actions{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.record-actions button{padding:8px 10px;font-size:.88rem}.empty{padding:25px 8px;text-align:center;color:var(--muted)}.status{min-height:1.4em;color:var(--muted);font-size:.9rem;margin-top:10px}.status.error{color:var(--red)}.activity-tools{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;margin-bottom:12px}.activity-item{border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden}.activity-header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:13px;background:white;color:inherit;border-radius:0}.activity-header:hover{background:#f7faf8}.activity-heading{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;border-radius:99px;background:#e8f0ed;color:#315b50;padding:3px 9px;font-size:.82rem;font-weight:700}.badge.delete{background:#fff0ef;color:var(--red)}.activity-time{color:var(--muted);font-size:.88rem}.activity-name{font-weight:700}.expand-icon{color:var(--green);font-size:.88rem;white-space:nowrap}.activity-change{display:none;margin:0;padding:13px;border-top:1px solid var(--border);color:#405650;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}.activity-item.expanded .activity-change{display:block}.foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:18px}details.activity-panel>summary{cursor:pointer;list-style:none;font-size:1.1rem;font-weight:700}details.activity-panel>summary::-webkit-details-marker{display:none}details.activity-panel>summary::after{content:"＋";float:right;color:var(--green)}details.activity-panel[open]>summary::after{content:"－"}details.activity-panel[open]>summary{margin-bottom:15px}dialog{width:min(600px,calc(100% - 28px));max-height:80vh;border:0;border-radius:16px;padding:20px;box-shadow:0 12px 45px #0004}dialog::backdrop{background:#10241dcc}.history-item{padding:12px 0;border-bottom:1px solid var(--border)}.history-item:last-child{border-bottom:0}.history-item strong{display:block}.history-detail{font-size:.9rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.record{grid-template-columns:1fr}.record-actions{justify-content:flex-start}.panel{padding:15px}.wrap{margin-top:14px}.activity-tools{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>立坑封底方數紀錄</h1><p>共用紀錄即時同步｜手機、平板及電腦皆可使用</p></header>
  <main class="wrap">
    <div class="notice"><strong>公開使用提醒：</strong>任何取得此連結的人都能查看、新增、修改及刪除紀錄。請勿記錄個人或敏感資訊。此頁不需登入，請僅供可信任的工作團隊使用。</div>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增紀錄</h2>
      <form id="recordForm">
        <div class="grid">
          <div class="field"><label for="manholeName">人孔名稱</label><input id="manholeName" name="manholeName" maxlength="100" required placeholder="例如：M-01"></div>
          <div class="field"><label for="volume">澆置方數（m³）</label><input id="volume" name="volume" type="number" min="0" step="any" required placeholder="例如：2.5"></div>
          <div class="field"><label for="recordDate">紀錄日期</label><input id="recordDate" name="recordDate" type="date" required></div>
          <div class="field full"><label for="note">備註（選填）</label><textarea id="note" name="note" maxlength="1000" placeholder="可記錄其他說明"></textarea></div>
        </div>
        <div class="actions"><button id="saveButton" type="submit">新增紀錄</button><button id="cancelEdit" class="secondary" type="button" hidden>取消編輯</button></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="toolbar"><h2 id="list-title">紀錄列表</h2><input id="search" type="search" placeholder="搜尋人孔名稱或備註" aria-label="搜尋紀錄"></div>
      <div class="toolbar"><div id="summary" class="summary">正在連線資料庫…</div><button id="exportCsv" class="secondary" type="button">匯出 CSV</button></div>
      <div id="records" aria-live="polite"></div>
    </section>
    <details class="panel activity-panel" aria-labelledby="activity-title">
      <summary id="activity-title">異動紀錄</summary>
      <div class="activity-tools">
        <input id="activitySearch" type="search" placeholder="搜尋人孔名稱、方數、日期、備註或操作類型" aria-label="搜尋異動紀錄">
        <select id="activityFilter" aria-label="篩選異動類型"><option value="all">全部異動</option><option value="新增">新增</option><option value="修改">修改</option><option value="刪除">刪除</option><option value="還原">還原</option></select>
      </div>
      <div id="activitySummary" class="summary">正在載入異動紀錄…</div>
      <div id="activityRecords" aria-live="polite"></div>
    </details>
    <p class="foot">資料存放於 Firebase Firestore；需連線網路才能即時讀寫及同步。</p>
  </main>
  <dialog id="historyDialog"><div class="toolbar"><h2 id="historyTitle">修改紀錄</h2><button id="closeHistory" class="secondary" type="button">關閉</button></div><div id="historyContent"></div></dialog>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, doc, writeBatch, onSnapshot, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBUBbTx4tOuYxl_2VqST0zIa1HV_IuFJqM",
      authDomain: "manhole-bottom-pouring-record.firebaseapp.com",
      projectId: "manhole-bottom-pouring-record",
      storageBucket: "manhole-bottom-pouring-record.firebasestorage.app",
      messagingSenderId: "296383551211",
      appId: "1:296383551211:web:f6fbe7b8d2cf1f971f10ae",
      measurementId: "G-NH254EVBZL"
    };
    const db = getFirestore(initializeApp(firebaseConfig));
    const recordsRef = collection(db, "records");
    const historyRef = collection(db, "history");
    const $ = selector => document.querySelector(selector);
    const form = $("#recordForm"), nameInput = $("#manholeName"), volumeInput = $("#volume"), dateInput = $("#recordDate"), noteInput = $("#note");
    const saveButton = $("#saveButton"), cancelEdit = $("#cancelEdit"), statusBox = $("#status"), recordsBox = $("#records"), searchInput = $("#search"), summary = $("#summary");
    const activityBox = $("#activityRecords"), activitySummary = $("#activitySummary"), activityFilter = $("#activityFilter"), activitySearch = $("#activitySearch");
    let records = [], activities = [], editingId = null;
    const localDate = () => { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`; };
    dateInput.value = localDate();
    function setStatus(message, isError=false) { statusBox.textContent = message; statusBox.classList.toggle("error", isError); }
    function safeText(tag, text, className) { const el = document.createElement(tag); if (className) el.className = className; el.textContent = text ?? ""; return el; }
    const actionLabels = {create:"新增", update:"修改", delete:"刪除", restore:"還原", "新增":"新增", "修改":"修改", "刪除（軟刪除）":"刪除"};
    function printable(data) { if (!data) return "（無）"; return `人孔：${data.manholeName || "—"}\n方數：${data.volume ?? "—"} m³\n日期：${data.recordDate || "—"}${data.note ? `\n備註：${data.note}` : ""}`; }

    function render() {
      const term = searchInput.value.trim().toLocaleLowerCase();
      const active = records.filter(record => !record.deleted).sort((a,b) => (b.recordDate || "").localeCompare(a.recordDate || "") || (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      const visible = active.filter(record => `${record.manholeName || ""} ${record.note || ""}`.toLocaleLowerCase().includes(term));
      summary.textContent = `共 ${active.length} 筆有效紀錄`;
      recordsBox.replaceChildren();
      if (!visible.length) { recordsBox.append(safeText("div", term ? "找不到符合的紀錄" : "尚無紀錄，請使用上方表單新增。", "empty")); return; }
      for (const record of visible) {
        const card = document.createElement("article"); card.className = "record";
        const details = document.createElement("div"); details.append(safeText("h3", record.manholeName || "（未命名）"));
        const meta = document.createElement("div"); meta.className = "meta";
        meta.append(safeText("span", `方數：${record.volume ?? "—"} m³`), safeText("span", `日期：${record.recordDate || "—"}`));
        details.append(meta); if (record.note) details.append(safeText("p", record.note, "note"));
        const buttons = document.createElement("div"); buttons.className = "record-actions";
        const edit = safeText("button", "編輯"); edit.type = "button"; edit.className = "secondary"; edit.addEventListener("click", () => beginEdit(record));
        const history = safeText("button", "修改紀錄"); history.type = "button"; history.className = "secondary"; history.addEventListener("click", () => showHistory(record));
        const remove = safeText("button", "刪除"); remove.type = "button"; remove.className = "danger"; remove.addEventListener("click", () => removeRecord(record));
        buttons.append(edit, history, remove); card.append(details, buttons); recordsBox.append(card);
      }
    }

    function renderActivities() {
      const filter = activityFilter.value, keyword = activitySearch.value.trim().toLocaleLowerCase();
      const entries = activities.filter(item => {
        const label = actionLabels[item.action] || item.action || "異動";
        if (filter !== "all" && label !== filter) return false;
        if (!keyword) return true;
        const time = item.changedAt?.toDate ? item.changedAt.toDate().toLocaleString("zh-TW") : "";
        return [label, time, printable(item.before), printable(item.after)].join(" ").toLocaleLowerCase().includes(keyword);
      });
      activitySummary.textContent = `共 ${entries.length} 筆符合條件的異動紀錄`;
      activityBox.replaceChildren();
      if (!entries.length) { activityBox.append(safeText("div", "目前沒有符合條件的異動紀錄。", "empty")); return; }
      for (const item of entries) {
        const row = document.createElement("article"); row.className = "activity-item";
        const header = document.createElement("button"); header.type = "button"; header.className = "activity-header";
        const heading = document.createElement("div"); heading.className = "activity-heading";
        const label = actionLabels[item.action] || item.action || "異動";
        const badge = safeText("span", label, "badge"); if (label === "刪除") badge.classList.add("delete");
        const current = item.after || item.before;
        heading.append(badge, safeText("span", current?.manholeName || "（未命名）", "activity-name"), safeText("span", item.changedAt?.toDate ? item.changedAt.toDate().toLocaleString("zh-TW") : "時間載入中", "activity-time"));
        const icon = safeText("span", "展開 ▾", "expand-icon"); header.append(heading, icon);
        const detail = safeText("div", `異動前：\n${printable(item.before)}\n\n異動後：\n${printable(item.after)}`, "activity-change");
        header.setAttribute("aria-expanded", "false");
        header.addEventListener("click", () => { const expanded = row.classList.toggle("expanded"); icon.textContent = expanded ? "收起 ▴" : "展開 ▾"; header.setAttribute("aria-expanded", String(expanded)); });
        row.append(header, detail); activityBox.append(row);
      }
    }

    function beginEdit(record) { editingId = record.id; nameInput.value = record.manholeName || ""; volumeInput.value = record.volume ?? ""; dateInput.value = record.recordDate || localDate(); noteInput.value = record.note || ""; $("#form-title").textContent = "編輯紀錄"; saveButton.textContent = "儲存修改"; cancelEdit.hidden = false; setStatus("正在編輯紀錄。請修改後儲存。"); window.scrollTo({top:0,behavior:"smooth"}); nameInput.focus(); }
    function resetForm() { editingId = null; form.reset(); dateInput.value = localDate(); $("#form-title").textContent = "新增紀錄"; saveButton.textContent = "新增紀錄"; cancelEdit.hidden = true; }
    function snapshot(record) { return {manholeName:record.manholeName || "",volume:record.volume ?? null,recordDate:record.recordDate || "",note:record.note || ""}; }
    function historyEntry(recordId, action, before, after) { return {recordId,action,before:before || null,after:after || null,changedAt:serverTimestamp()}; }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const entry = {manholeName:nameInput.value.trim(),volume:Number(volumeInput.value),recordDate:dateInput.value,note:noteInput.value.trim()};
      if (!entry.manholeName || !Number.isFinite(entry.volume) || entry.volume < 0 || !entry.recordDate) { setStatus("請填寫有效的人孔名稱、非負數方數及日期。", true); return; }
      saveButton.disabled = true;
      try {
        const batch = writeBatch(db);
        if (editingId) {
          const original = records.find(record => record.id === editingId); if (!original) throw new Error("找不到這筆紀錄，請重新整理後再試。");
          batch.update(doc(db,"records",editingId), {...entry,updatedAt:serverTimestamp()}); batch.set(doc(historyRef),historyEntry(editingId,"修改",snapshot(original),entry));
          await batch.commit(); setStatus("修改已儲存，並已記錄異動。");
        } else {
          const recordDoc = doc(recordsRef); batch.set(recordDoc,{...entry,deleted:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); batch.set(doc(historyRef),historyEntry(recordDoc.id,"新增",null,entry));
          await batch.commit(); setStatus("紀錄已新增。");
        }
        resetForm();
      } catch (error) { console.error(error); setStatus(`儲存失敗：${error.message || "請確認 Firestore 已建立且規則允許存取。"}`, true); }
      finally { saveButton.disabled = false; }
    });
    cancelEdit.addEventListener("click", () => { resetForm(); setStatus("已取消編輯。"); });

    async function removeRecord(record) {
      if (!window.confirm(`確定將「${record.manholeName}」這筆紀錄刪除？\n\n刪除後會從一般列表隱藏，並保留異動紀錄。`)) return;
      try { const batch = writeBatch(db); batch.update(doc(db,"records",record.id),{deleted:true,deletedAt:serverTimestamp(),updatedAt:serverTimestamp()}); batch.set(doc(historyRef),historyEntry(record.id,"刪除（軟刪除）",snapshot(record),null)); await batch.commit(); if (editingId === record.id) resetForm(); setStatus("紀錄已刪除，異動紀錄已保留。"); }
      catch (error) { console.error(error); setStatus(`刪除失敗：${error.message || "請稍後再試。"}`, true); }
    }

    async function showHistory(record) {
      const dialog = $("#historyDialog"); $("#historyTitle").textContent = `修改紀錄｜${record.manholeName || "未命名"}`;
      const content = $("#historyContent"); content.replaceChildren(safeText("div","載入中…","empty")); dialog.showModal();
      try {
        const result = await getDocs(query(historyRef,where("recordId","==",record.id)));
        const entries = result.docs.map(item => item.data()).sort((a,b) => (b.changedAt?.toMillis?.() || 0) - (a.changedAt?.toMillis?.() || 0)); content.replaceChildren();
        if (!entries.length) { content.append(safeText("div","尚無修改紀錄。","empty")); return; }
        for (const item of entries) { const row = document.createElement("div"); row.className = "history-item"; const time = item.changedAt?.toDate ? item.changedAt.toDate().toLocaleString("zh-TW") : "時間載入中"; row.append(safeText("strong",`${actionLabels[item.action] || item.action || "異動"} · ${time}`),safeText("div",`異動前：\n${printable(item.before)}\n\n異動後：\n${printable(item.after)}`,"history-detail")); content.append(row); }
      } catch (error) { console.error(error); content.replaceChildren(safeText("div",`讀取異動紀錄失敗：${error.message || "請確認 Firestore 規則允許讀取 history。"}`,"empty")); }
    }

    $("#closeHistory").addEventListener("click",() => $("#historyDialog").close());
    $("#historyDialog").addEventListener("click",event => { if (event.target === event.currentTarget) event.currentTarget.close(); });
    searchInput.addEventListener("input",render); activityFilter.addEventListener("change",renderActivities); activitySearch.addEventListener("input",renderActivities);
    $("#exportCsv").addEventListener("click",() => {
      const data = records.filter(record => !record.deleted).sort((a,b) => (b.recordDate || "").localeCompare(a.recordDate || ""));
      if (!data.length) { setStatus("沒有可匯出的紀錄。", true); return; }
      const quote = value => `"${String(value ?? "").replaceAll('"','""')}"`;
      const lines = [["人孔名稱","澆置方數（m³）","紀錄日期","備註"],...data.map(record => [record.manholeName,record.volume,record.recordDate,record.note])].map(row => row.map(quote).join(","));
      const blob = new Blob(["\ufeff" + lines.join("\r\n")],{type:"text/csv;charset=utf-8"}); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `立坑封底方數紀錄_${localDate()}.csv`; link.click(); URL.revokeObjectURL(link.href);
    });

    onSnapshot(recordsRef,snap => { records = snap.docs.map(item => ({id:item.id,...item.data()})); render(); if (!statusBox.textContent) setStatus("資料已同步。"); },error => { console.error(error); summary.textContent = "無法載入紀錄"; setStatus(`資料載入失敗：${error.message || "請確認網路與 Firestore 規則。"}`,true); });
    onSnapshot(historyRef,snap => { activities = snap.docs.map(item => ({id:item.id,...item.data()})).sort((a,b) => (b.changedAt?.toMillis?.() || 0) - (a.changedAt?.toMillis?.() || 0)); renderActivities(); },error => { console.error(error); activitySummary.textContent = `無法載入異動紀錄：${error.message || "請確認 Firestore 規則。"}`; });
    if ("serviceWorker" in navigator) window.addEventListener("load",() => navigator.serviceWorker.register("./sw.js").catch(console.warn));
  </script>
</body>
</html>
